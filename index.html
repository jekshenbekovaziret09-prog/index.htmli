<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amina ❤️</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

canvas {
    display: block;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;
let angle = 0;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;
}

resize();
window.addEventListener("resize", resize);


function heartX(t) {
    return 16 * Math.pow(Math.sin(t), 3);
}

function heartY(t) {
    return 13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);
}


function animate() {

    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, W, H);

    const cx = W / 2;
    const cy = H / 2;

    /*
       I LOVE YOU вокруг сердца
    */

    for (let i = 0; i < 80; i++) {

        let t = (i / 80) * Math.PI * 2 + angle;

        let x = cx + heartX(t) * 10;
        let y = cy - heartY(t) * 10;

        ctx.save();

        ctx.translate(x, y);
        ctx.rotate(-t - Math.PI / 2);

        ctx.font = "bold 14px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.shadowColor = "#ff1493";
        ctx.shadowBlur = 10;

        ctx.fillStyle = "#ff69b4";

        ctx.fillText("I love you", 0, 0);

        ctx.restore();
    }


    /*
       AMINA внутри сердца
    */

    ctx.save();

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.font = "bold 52px Georgia";

    ctx.shadowColor = "#ff1493";
    ctx.shadowBlur = 25;

    ctx.fillStyle = "#ffb6dc";

    ctx.fillText(
        "𝓐𝓶𝓲𝓷𝓪",
        cx,
        cy
    );

    ctx.restore();


    /*
       Анимация
    */

    angle += 0.01;

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
